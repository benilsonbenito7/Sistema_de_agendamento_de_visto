services:
  db:
    image: postgres:17
    container_name: visalink_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: visalink
      POSTGRES_PASSWORD: visalink_dev
      POSTGRES_DB: visalink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
